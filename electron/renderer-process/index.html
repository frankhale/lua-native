<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lua-native in the renderer</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="split">
    <header>
      <button id="run" type="button">Run</button>
      <button id="pause" type="button">Pause</button>
      <span id="status" role="status"></span>
    </header>
    <p id="hint">
      Lua runs inside this window's renderer process. Every drawing call is a direct JavaScript
      call into the canvas, with no IPC.
    </p>
    <main>
      <section class="editor">
        <textarea id="source" spellcheck="false" wrap="off" aria-label="Lua source"></textarea>
        <pre id="output" aria-label="Output" aria-live="polite"></pre>
      </section>
      <div class="stage">
        <canvas id="stage" aria-label="Canvas drawn by Lua"></canvas>
      </div>
    </main>
    <script src="page.js"></script>
  </body>
</html>
